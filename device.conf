# devices/shiba/device.conf: what this device repository is (docs/porting/repositories.md has every word).
# Ported from the Pixel 8a (akita, github.com/Martinvlba/hakios-devices-akita): the same SoC (Tensor G3, zuma). First boot on a
# Pixel 8, 2026-11-22: U-Boot, the loader, XNU on one core, hello (boot-info/first-boot-2026-11-22-hello.txt); the parts below
# have not run yet: "partial" is what works on the 8a with the same hardware or with what differs ported, "missing" is what
# the 8a's drivers cannot do here.

device shiba
	title       Pixel 8
	vendor      Google
	soc         zuma
	defconfig   shiba_defconfig
	maintainer  3kierz
	status      display     partial   the bootloader's framebuffer (0xfac00000, 1080 x 2400); the panel's rate and brightness commands set for the Pixel 8's google-shoreline (TE select, TE width, 2-1000 nits normal, HBM to 1400); not yet run
	status      touch       partial   Goodix Berlin-D (goodix,brl-d) on SPI (HSI0 USI2), the 8a's pins, powered at 3.3 V; the 8a's Berlin driver, which reads the chip's own layout (CONFIG_HAKIOS_AKITA_TOUCH, touchscreen=1); not yet run
	status      buttons     partial   power, volume up, volume down: the same always-on pins as the 8a (CONFIG_HAKIOS_AKITA_KEYS, buttons=1); not yet run
	status      cpu         partial   one core seen running XNU (2026-11-22); all 9 cores, ACPM's clocks (dvfs=1), idle cores powered down (cpuidle=1): the SoC's, as on the 8a; not yet run
	status      usb         partial   seen as an iPhone (usbmux, PTP): the SoC's DWC3, as on the 8a; not yet run
	status      storage     partial   UFS through U-Boot, Darwin from the darwin partition: as on the 8a; not yet run
	status      gpu         partial   Mali-G715 with HakiOS's Metal driver: the SoC's, as on the 8a; not yet run
	status      battery     partial   MAX77759 fuel gauge and charger on hsi2c@10cb0000, as on the 8a (the Pixel 8 adds a PCA9468 charge pump, not driven); not yet run
	status      audio       partial   two CS35L41s on spi@111C0000, the same pins as the 8a's, through the AoC; not yet run
	status      haptic      partial   CS40L26A, the 8a's bus and pins; boost 11 V, f0/ReDC from haptic_f0=/haptic_redc= (the tree's 0x244000/0x68000 without); not yet run
	status      torch       partial   LM3644 on hsi2c@10980000, the same as the 8a's; not yet run
	status      thermal     partial   ACPM's SoC sensors; the board's eight NTCs in the Pixel 8's order (neutral, quiet, charge, usb_pwr, cam, disp, north, soc) and its VIRTUAL-SKIN; not yet run
	status      wifi        missing   Broadcom BCM4398 on PCIe channel 1: the link and the chip's identity (pcie=5); the chip's own steps are the 8a's BCM4383's
	status      bluetooth   missing   the BCM4398's HCI on the 8a's UART and pins: the 8a's driver, not in the defaults until tried (bt=1)
	status      camera      missing   other sensors (boitata, dokkaebi, sandworm) than the 8a's: its driver is left out
	status      cellular    missing   Exynos 5300 on PCIe channel 0, as on the 8a (modem=N, off by default)
	status      sensors     missing   behind the AoC; GNSS is a Broadcom BCM4775 (the 8a's is Samsung's Kepler): left out
