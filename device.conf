# devices/shiba/device.conf: what this device repository is (docs/porting/repositories.md has every word).
# Ported from the Pixel 8a (akita, github.com/Martinvlba/hakios-devices-akita): the same SoC (Tensor G3, zuma). First boot on a
# Pixel 8, 2026-11-22: U-Boot, the loader, XNU on one core, hello (boot-info/first-boot-2026-11-22-hello.txt); the parts below
# have not run yet: "partial" is what works on the 8a with the same hardware or with what differs ported, "missing" is what
# the 8a's drivers cannot do here.

device shiba
	title       Pixel 8
	vendor      Google
	soc         zuma
	defconfig   shiba_defconfig
	maintainer  3kierz
	status      display     partial   google-bigsurf (this phone; panel_name=bigsurf, the bootloader's choice printed by U-Boot) taken over: 3 buffers flipped by DPP0, 60 -> 120 Hz by bigsurf's own commands (2026-11-22); brightness and power commands not yet seen; shoreline's untested
	status      touch       works     Goodix GT9916 (Berlin-D; "BERLIN", firmware 9916R) on SPI (HSI0 USI2), powered by U-Boot (zuma touch: LDO4M 3.3 V, LDO25M), polled; fingers tracked at 240 reports a second (2026-11-22; CONFIG_HAKIOS_AKITA_TOUCH, touchscreen=1)
	status      buttons     works     power, volume up, volume down: pressed and released seen (2026-11-22; CONFIG_HAKIOS_AKITA_KEYS, buttons=1)
	status      cpu         partial   all 9 cores started (2026-11-22: the big five at once, the A510s later by design); ACPM's clocks (dvfs=1) and idle cores powered down (cpuidle=1) not yet run
	status      usb         partial   seen as an iPhone (usbmux, PTP): the SoC's DWC3, as on the 8a; not yet run
	status      storage     partial   UFS through U-Boot, Darwin from the darwin partition: as on the 8a; not yet run
	status      gpu         partial   Mali-G715 with HakiOS's Metal driver: the SoC's, as on the 8a; not yet run
	status      battery     partial   MAX77759 fuel gauge and charger on hsi2c@10cb0000, as on the 8a (the Pixel 8 adds a PCA9468 charge pump, not driven); not yet run
	status      audio       partial   sound from the speakers (2026-11-23): the phone's own aoc.bin authenticated and started by the GSA (Trusty, the Pixel 8's board id 0x40302), 94 services, a 440 Hz tone through audio_playback1 to both CS35L41s (aoc=3 amp=2 speaker=1 aocplay=4); iOS's sound and the microphones need iOS running
	status      haptic      works     CS40L26A with Cirrus's RAM firmware from the phone (rev 7.2.91, 14 waves) and the Pixel 8's tuning (boost 11 V, 2.5 A; this phone's f0/ReDC via haptic_f0=/haptic_redc=): a click and a 300 ms vibration felt (haptic=4, 2026-11-23); iOS's own feedback (haptic=5) needs iOS running
	status      torch       partial   LM3644 on hsi2c@10980000, the same as the 8a's; not yet run
	status      thermal     partial   ACPM's SoC sensors; the board's eight NTCs in the Pixel 8's order (neutral, quiet, charge, usb_pwr, cam, disp, north, soc) and its VIRTUAL-SKIN; not yet run
	status      wifi        partial   the PCIe link to the Broadcom BCM4398 (14e4:4444, rev 3) up at Gen2 x1 and its identity read (pcie=5, 2026-11-22); the chip's own steps (firmware, rings, station) are still the 8a's BCM4383's, and the 4398 reports another interconnect (type 6, no core count): not ported
	status      bluetooth   missing   the BCM4398's HCI on the 8a's UART and pins: the 8a's driver, not in the defaults until tried (bt=1)
	status      camera      missing   other sensors (boitata, dokkaebi, sandworm) than the 8a's: its driver is left out
	status      cellular    missing   Exynos 5300 on PCIe channel 0, as on the 8a (modem=N, off by default)
	status      sensors     missing   behind the AoC; GNSS is a Broadcom BCM4775 (the 8a's is Samsung's Kepler): left out
